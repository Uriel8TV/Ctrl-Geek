<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ctrl+Geek - Ensamblador de Producción</title>
    <!-- Cargamos jsPDF directamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background-color: #1e1e1e; color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            padding: 30px; margin: 0;
        }
        h2 { color: #569cd6; text-align: center; margin-bottom: 30px; font-weight: normal; }

        /* Zona para soltar archivos */
        .drop-zone {
            border: 2px dashed #569cd6; border-radius: 8px;
            padding: 50px; text-align: center; cursor: pointer;
            background: #252526; margin-bottom: 30px; transition: 0.2s;
        }
        .drop-zone.dragover { background: #2d2d30; border-color: #4CAF50; color: #4CAF50; }

        /* Cuadrícula de previsualización */
        .preview-grid { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-bottom: 30px; }
        .preview-item {
            width: 400px; height: 188px; /* Proporción a escala de 20x9.4 */
            background: #333; border: 1px solid #555;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border-radius: 4px; position: relative;
        }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-item::after {
            content: '✂️ Línea de corte'; position: absolute;
            bottom: 5px; right: 5px; font-size: 10px; color: #aaa; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px;
        }

        /* Botón de acción */
        .btn-imprimir {
            background: #25D366; color: white; border: none;
            padding: 15px 30px; font-size: 16px; font-weight: bold;
            border-radius: 4px; cursor: pointer; width: 100%;
        }
        .btn-imprimir:disabled { background: #555; color: #888; cursor: not-allowed; }
        .btn-imprimir:hover:not(:disabled) { background: #1ebe5d; }
    </style>
</head>
<body>
    <h2>🖨️ Ensamblador de Producción A4</h2>

    <div id="dropZone" class="drop-zone">
        <strong>Arrastra aquí los diseños PNG</strong><br>
        <span style="font-size: 13px; color: #888;">Máximo 3 diseños por hoja A4 (20x9.4 cm)</span>
    </div>

    <div class="preview-grid" id="previewGrid"></div>

    <button id="btnGenerar" class="btn-imprimir" disabled>Generar PDF Listo para Imprimir (0/3)</button>

    <script src="renderer.js"></script>
</body>
</html>
